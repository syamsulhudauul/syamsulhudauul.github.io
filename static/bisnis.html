<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syamsul Huda — Solusi AI & Otomasi Alur Bisnis</title>
  <style>
    :root {
      --bg: #fffdf9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --border: #0f172a;
      --yellow: #fef08a;
      --orange: #ffedd5;
      --blue: #e0f2fe;
      --shadow: 4px 4px 0px #0f172a;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      line-height: 1.6;
      padding: 0 16px 80px;
    }
    .container {
      max-width: 740px;
      margin: 0 auto;
    }

    /* Top Nav */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
    }
    .nav-brand {
      font-weight: 900;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-badge {
      font-size: 11px;
      font-weight: 700;
      background: #ecfdf5;
      color: #059669;
      border: 1.5px solid #059669;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .nav-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .lang-toggle {
      display: inline-flex; border: 2px solid var(--border); border-radius: 999px; overflow: hidden;
      background: #fff; box-shadow: 2px 2px 0px var(--border); flex-shrink: 0;
    }
    .lang-btn {
      border: 0; background: transparent; font: inherit; font-size: 11.5px; font-weight: 800;
      padding: 4px 11px; cursor: pointer; color: var(--text); transition: background .15s ease;
    }
    .lang-btn + .lang-btn { border-left: 2px solid var(--border); }
    .lang-btn:hover { background: var(--yellow); }
    .lang-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
    [data-i18n] { transition: opacity .14s ease; }
    .i18n-swap [data-i18n] { opacity: 0; }
    @media (prefers-reduced-motion: reduce) { [data-i18n] { transition: none; } }


    html { scroll-behavior:smooth; }
    section[id], #layanan { scroll-margin-top: 24px; }
    .nav-brand a { color: inherit; text-decoration: none; }
    .site-links { display:flex; gap:1rem; margin-left:auto; margin-right:1rem; }
    .site-links a { color:var(--text); text-decoration:none; font-size:13px; font-weight:700; }
    .audience-paths { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin:24px 0 38px; }
    .audience-card { display:flex; flex-direction:column; min-height:230px; padding:24px; background:#fff; border:1px solid #d7d4c9; border-radius:20px; color:var(--text); text-decoration:none; box-shadow:0 8px 26px rgba(41,50,38,.07); transition:transform .2s ease, box-shadow .2s ease; }
    .audience-card:hover,.audience-card:focus-visible { transform:translateY(-3px); box-shadow:0 14px 32px rgba(41,50,38,.13); outline:2px solid #147d52; outline-offset:3px; }
    .audience-image { width:100%; height:120px; object-fit:cover; object-position:center 47%; border-radius:12px; margin-bottom:18px; }
    .audience-card.enterprise { background:#f1f5eb; }
    .path-kicker { color:#147d52; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .audience-card h2 { margin:14px 0 8px; font-size:clamp(21px,3vw,28px); }
    .audience-card p { color:#475569; line-height:1.6; }
    .path-link { margin-top:auto; color:#116b48; font-weight:800; }
    .lang-btn:focus-visible,.label:focus-visible,.chip-btn:focus-visible { outline:3px solid #147d52; outline-offset:3px; }
    @media(max-width:600px) { .audience-paths { grid-template-columns:1fr; } .audience-card { min-height:190px; } .site-links { gap:.5rem; margin-right:.25rem; } }

    /* Hero Section */
    .hero {
      padding: 16px 0 28px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--yellow);
      border: 2px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 2px 2px 0px var(--border);
      margin-bottom: 16px;
    }
    .badge-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }
    .hero h1 {
      font-size: clamp(26px, 5.2vw, 40px);
      font-weight: 900;
      line-height: 1.22;
      letter-spacing: -0.02em;
      margin-bottom: 14px;
    }
    .hero h1 span {
      background: var(--yellow);
      padding: 0 6px;
      border: 2px solid var(--border);
      box-shadow: 3px 3px 0px var(--border);
      display: inline-block;
      margin-top: 4px;
    }
    .hero-desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }


    /* ---------- 3D Mascot Stage (Three.js) ---------- */
    .mascot-stage {
      position: relative;
      margin: 20px 0 32px;
      border: 3px solid var(--border);
      border-radius: 24px;
      height: clamp(290px, 64vw, 400px);
      background:
        radial-gradient(70% 60% at 50% 105%, rgba(34,197,94,.16), transparent 70%),
        radial-gradient(60% 50% at 50% 0%, rgba(254,240,138,.35), transparent 70%),
        linear-gradient(180deg, #ffffff, #f1f5f9);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    #stage3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: pointer; }
    .stage-tag {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 10.5px; font-weight: 800;
      letter-spacing: .02em; background: #fef08a; color: #0f172a; border: 1.5px solid #0f172a;
      padding: 3px 14px; border-radius: 999px; white-space: nowrap; box-shadow: 2px 2px 0px #0f172a;
      z-index: 5; pointer-events: none;
    }
    .stage-fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 56px; gap: 18px; }
    .no-webgl .stage-fallback { display: flex; }
    .no-webgl #stage3d { display: none; }
    .trio { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); pointer-events: none; }
    .char { position: relative; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 12px; }
    .label {
      pointer-events: auto; cursor: pointer; font: inherit; font-size: 11px; font-weight: 800; color: #0f172a;
      background: #ffffff; border: 1.5px solid #0f172a; padding: 3px 10px; border-radius: 999px;
      white-space: nowrap; box-shadow: 2px 2px 0px #0f172a; outline: none;
    }
    .label small { color: #64748b; font-weight: 600; }
    .label:focus-visible { border-color: #22c55e; box-shadow: 2px 2px 0 #22c55e; }
    .label:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #0f172a; }
    .bubble {
      position: absolute; left: 50%; top: 8%; z-index: 15; max-width: 170px;
      background: #0f172a; color: #ffffff; font-size: 11.5px; font-weight: 800; line-height: 1.35; text-align: center;
      padding: 7px 12px; border-radius: 12px; width: max-content; pointer-events: none;
      opacity: 0; transform: translate(-50%, 8px) scale(.85); transform-origin: 50% 100%;
      box-shadow: 0 4px 14px rgba(15,23,42,.2);
      transition: opacity .18s, transform .35s cubic-bezier(.34,1.56,.64,1);
    }
    .bubble::after {
      content: ""; position: absolute; top: 100%; left: 50%; margin-left: -6px;
      border: 6px solid transparent; border-top-color: #0f172a;
    }
    .bubble.on { opacity: 1; transform: translate(-50%, 0) scale(1); }

    @media (max-width: 600px) {
      .nav { flex-wrap:wrap; gap:8px; padding:10px 0; }
      .nav-brand { flex:1 1 auto; white-space:nowrap; }
      .nav-badge { display:none; }
      .nav-right { margin-left:auto; }
      .site-links { order:3; margin:0; font-size:12px; }
      .lang-btn { padding:4px 8px; }
      .mascot-stage { height:clamp(260px, 78vw, 320px); }
      .trio { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .label { font-size:9px; padding:3px 4px; white-space:normal; text-align:center; min-height:36px; max-width:100%; }
      .label small { display:block; }
      .bubble { max-width:112px; font-size:10px; padding:6px; overflow-wrap:anywhere; }
      .stage-tag { max-width:calc(100% - 24px); white-space:normal; text-align:center; }
    }

    /* Buttons */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 22px;
      font-size: 14px;
      font-weight: 800;
      border-radius: 12px;
      border: 2px solid var(--border);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: var(--shadow);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 4px 6px 0px var(--border);
    }
    .btn-secondary {
      background: #ffffff;
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .btn-secondary:hover {
      background: var(--yellow);
      transform: translateY(-2px);
    }

    /* Proof Numbers */
    .proof-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 44px;
    }
    .proof-item {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 3px 3px 0px var(--border);
    }
    .proof-num {
      font-size: 24px;
      font-weight: 900;
      color: #0f172a;
    }
    .proof-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Solution Card Layout */
    .solution-card {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 32px;
    }
    .card-head-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .service-tag {
      font-size: 11px;
      font-weight: 800;
      background: var(--yellow);
      border: 1.5px solid var(--border);
      padding: 2px 10px;
      border-radius: 999px;
    }
    .card-title {
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    /* Professional Narrative Sections */
    .block-pain {
      background: #fff1f2;
      border-left: 4px solid #f43f5e;
      padding: 12px 14px;
      border-radius: 4px 10px 10px 4px;
      margin-bottom: 14px;
      font-size: 13.5px;
      color: #881337;
      line-height: 1.55;
    }
    .block-pain h5 {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      color: #be123c;
    }

    .block-sol {
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
      padding: 12px 14px;
      border-radius: 4px 10px 10px 4px;
      margin-bottom: 16px;
      font-size: 13.5px;
      color: #14532d;
      line-height: 1.55;
    }
    .block-sol h5 {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      color: #15803d;
    }

    .block-results {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
    }
    .block-results h5 {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0f172a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .results-list {
      list-style: none;
      font-size: 13px;
      color: #334155;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .results-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .results-list li::before {
      content: "✔";
      color: #16a34a;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* Interactive WA Demo */
    .demo-box {
      background: #f1f5f9;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin: 16px 0;
    }
    .demo-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      margin-bottom: 8px;
    }
    .wa-chat {
      background: #efeae2;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12.5px;
    }
    .chat-bubble {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 8px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .chat-user {
      align-self: flex-end;
      background: #dcf8c6;
      border-top-right-radius: 0;
    }
    .chat-bot {
      align-self: flex-start;
      background: #ffffff;
      border-top-left-radius: 0;
    }
    .chip-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .chip-btn {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 1px 1px 0px var(--border);
      transition: background 0.15s ease;
    }
    .chip-btn:hover {
      background: var(--yellow);
    }

    /* Final CTA Section */
    .final-cta {
      background: var(--yellow);
      border: 3px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 6px 6px 0px var(--border);
      margin-top: 48px;
    }
    .final-cta h2 {
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .final-cta p {
      font-size: 14.5px;
      color: #334155;
      max-width: 520px;
      margin: 0 auto 22px;
    }
    .trust-badges {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .trust-pill {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Nav Bar -->
    <header class="nav">
      <div class="nav-brand"><a href="/">⚡ Syamsul Huda (Uul)</a></div>
      <nav class="site-links" aria-label="Main navigation"><a href="/#work" data-i18n="navWork"></a><a href="#layanan" data-i18n="navServices"></a></nav>
      <div class="nav-right">
        <div class="nav-badge" data-i18n="auth"></div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="id" aria-pressed="true">🇮🇩 ID</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">🇬🇧 EN</button>
        </div>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-badge">
        <span class="badge-dot"></span> <span data-i18n="heroBadge"></span>
      </div>
      <h1 data-i18n="h1" data-html></h1>
      <p class="hero-desc" data-i18n="sub"></p>



  <!-- 3D mascot stage: Three.js (cdnjs), procedural geometry, no model files -->
      <section class="mascot-stage" id="stage" aria-label="Trio karakter 3D interaktif">
        <canvas id="stage3d" aria-hidden="true"></canvas>
        <div class="stage-fallback" aria-hidden="true"><span>🤖</span><span>🧑‍💻</span><span>⚙️</span></div>
        <div class="stage-tag" data-i18n="stageTag">Gerakkan kursor · sentuh · klik karakter</div>
        <div class="trio">
          <div class="char bot">
            <div class="bubble" id="bubbleBot">CS 24 jam, tanpa libur!</div>
            <button type="button" class="label" id="btnBot" aria-label="Chat-Bot, maskot layanan pelanggan">Chat-Bot <small>· Layanan pelanggan</small></button>
          </div>
          <div class="char uul">
            <div class="bubble" id="bubbleUul">Halo! Saya Uul 👋</div>
            <button type="button" class="label" id="btnUul" aria-label="Uul, AI builder">Uul <small>· AI Builder</small></button>
          </div>
          <div class="char gear">
            <div class="bubble" id="bubbleGear">Otomasi tanpa capek!</div>
            <button type="button" class="label" id="btnGear" aria-label="Workflow-Gear, maskot otomasi">Workflow-Gear <small>· Otomasi</small></button>
          </div>
        </div>
      </section>

    <nav class="audience-paths" aria-label="Choose your business type">
      <a class="audience-card" href="#layanan">
        <img class="audience-image" src="/static/umkm-workflow-hero.jpg" alt="Pemilik kedai meninjau alur pesanan di tablet" loading="lazy"><span class="path-kicker" data-i18n="pathSmall"></span>
        <h2 data-i18n="pathSmallTitle"></h2>
        <p data-i18n="pathSmallBody"></p>
        <span class="path-link" data-i18n="pathSmallLink"></span>
      </a>
      <a class="audience-card enterprise" href="/#work">
        <span class="path-kicker" data-i18n="pathEnterprise"></span>
        <h2 data-i18n="pathEnterpriseTitle"></h2>
        <p data-i18n="pathEnterpriseBody"></p>
        <span class="path-link" data-i18n="pathEnterpriseLink"></span>
      </a>
    </nav>

    <!-- 3 Core Solutions -->
    <div id="layanan">

      <!-- Solution 1 -->
      <div class="solution-card">
        <div class="card-head-row">
          <span class="service-tag" data-i18n="s1tag"></span>

        <h3 class="card-title" data-i18n="s1title"></h3>

        <div class="block-pain">
          <h5 data-i18n="painH"></h5>

        <div class="block-sol">

        <!-- Interactive Demo -->

            <span data-i18n="demoBar"></span>
            <span data-i18n="demoLive"></span>
          </div>

            <div class="chat-bubble chat-bot" id="cBot"></div>

          <div class="chip-row">
            <button class="chip-btn" onclick="setChat('promo')" data-i18n="chipPromo"></button>
            <button class="chip-btn" onclick="setChat('stok')" data-i18n="chipStok"></button>

        <div class="block-results">
          <h5 data-i18n="resH"></h5>
          <ul class="results-list">
            <li data-i18n="s1r1" data-html></li>
            <li data-i18n="s1r2" data-html></li>
            <li data-i18n="s1r3" data-html></li>
          </ul>
        </div>
      </div>

      <!-- Solution 2 -->
      <div class="solution-card">
        <div class="card-head-row">
          <span class="service-tag" style="background: #ffedd5; color: #9a3412;" data-i18n="s2tag"></span>
        </div>
        <h3 class="card-title" data-i18n="s2title"></h3>

        <div class="block-pain">
          <h5 data-i18n="painH"></h5>
          <span data-i18n="s2pain" data-html></span>
        </div>

        <div class="block-sol">
          <h5 data-i18n="solH"></h5>
          <span data-i18n="s2sol" data-html></span>
        </div>

        <div class="block-results">
          <h5 data-i18n="resH"></h5>
          <ul class="results-list">
            <li data-i18n="s2r1" data-html></li>

            <li data-i18n="s2r3" data-html></li>
          </ul>
        </div>
      </div>

      <!-- Solution 3 -->
      <div class="solution-card">
        <div class="card-head-row">
          <span class="service-tag" style="background: #e0f2fe; color: #0369a1;" data-i18n="s3tag"></span>
        </div>
        <h3 class="card-title" data-i18n="s3title"></h3>

        <div class="block-pain">
          <h5 data-i18n="painH"></h5>
          <span data-i18n="s3pain" data-html></span>
        </div>

        <div class="block-sol">
          <h5 data-i18n="solH"></h5>
          <span data-i18n="s3sol" data-html></span>
        </div>

        <div class="block-results">
          <h5 data-i18n="resH"></h5>
          <ul class="results-list">
            <li data-i18n="s3r1" data-html></li>
            <li data-i18n="s3r2" data-html></li>
            <li data-i18n="s3r3" data-html></li>
          </ul>

      bot.mouth = arc(.1, .02, Math.PI * .8, basic(0x4ade80)); bot.mouth.rotation.z = -Math.PI * .9; bot.mouth.position.set(0, .56, .82); fl.add(bot.mouth);
      [-1, 1].forEach(s => fl.add(ell(.1, .2, .2, green, s * .78, .56, 0)));
      fl.add(ell(.32, .15, .08, visor, 0, -.12, .74));
      bot.dots = [-1, 0, 1].map(i => { const d = ell(.04, .04, .04, basic(0x4ade80), i * .12, -.12, .8); fl.add(d); return d; });
      bot.arms = [-1, 1].map(s => {
        const p = new THREE.Group(); p.position.set(s * .8, .05, 0);
        p.add(at(capsule(.1, .32, white), 0, -.3, 0)); p.add(ell(.11, .11, .11, green, 0, -.55, 0));
        fl.add(p); return p;
      });
      bot.ant = new THREE.Group(); bot.ant.position.set(0, 1.22, 0);
      bot.ant.add(at(new THREE.Mesh(new THREE.CylinderGeometry(.022, .022, .3, 8), std(0x94a3b8, .4, .6)), 0, .15, 0));
      bot.ant.add(ell(.07, .07, .07, green, 0, .32, 0)); fl.add(bot.ant);
      bot.wifi = new THREE.Group(); bot.wifi.position.set(0, 2.0, 0); fl.add(bot.wifi);
      bot.waves = [.2, .35, .5].map(r => {
        const m = arc(r, .035, Math.PI / 2, basic(0x22c55e, { transparent: true, opacity: .3 })); m.rotation.z = Math.PI / 4; bot.wifi.add(m); return m;
      });
      bot.wifi.add(at(ell(.055, .055, .055, basic(0x22c55e)), 0, -.02, 0));
      g.add(bot.hit = hitProxy(1.6, 0, 1.6));
      hits.push(bot);
    }

    /* ---- Workflow-Gear (real beveled 3D gold gear + meshing mini gear) ---- */
    const gear = { key: 'gear', g: new THREE.Group() };
    {
      const N1 = 10, N2 = 6, PHI = -.65, DIST = 1.52;
      const gold = std(0xf2ae12, .26, .9, { emissive: C(0xff9a00), emissiveIntensity: 0 });
      const plate = std(0xfcd34d, .32, .65, { emissive: C(0xff9a00), emissiveIntensity: 0 });
      const steel = std(0xb8c4d6, .3, .9);
      const root = gear.root = new THREE.Group(); root.position.set(-.7, 1.78, 0); gear.g.add(root);
      gear.tilt = new THREE.Group(); root.add(gear.tilt);
      gear.big = new THREE.Mesh(gearGeo(N1, .95, .78, .34), gold); gear.tilt.add(gear.big);
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + .5; gear.big.add(ell(.05, .05, .05, std(0xb45309, .4, .7), Math.cos(a) * .74, Math.sin(a) * .74, .26)); }
      gear.mini = new THREE.Mesh(gearGeo(N2, .575, .405, .34), steel);
      gear.mini.position.set(Math.cos(PHI) * DIST, Math.sin(PHI) * DIST, 0); gear.tilt.add(gear.mini);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(.14, .14, .5, 16), std(0x64748b, .35, .8)); hub.rotation.x = Math.PI / 2; gear.mini.add(hub);
      const face = gear.face = new THREE.Group(); face.position.z = .2; gear.tilt.add(face);
      const pl = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, .12, 40), plate); pl.rotation.x = Math.PI / 2; pl.position.z = .06; face.add(pl);
      const rg = new THREE.Mesh(new THREE.TorusGeometry(.6, .045, 10, 40), std(0xc2710c, .35, .8)); rg.position.z = .12; face.add(rg);
      gear.pupils = [];
      gear.eyes = [-1, 1].map(s => {
        const e = new THREE.Group(); e.position.set(s * .24, .1, .2);
        e.add(ell(.13, .15, .08, std(0xffffff, .3, 0)));
        const pu = new THREE.Group(); pu.position.z = .05;
        pu.add(ell(.075, .09, .04, std(0x3a2108, .3, 0))); pu.add(ell(.025, .025, .02, basic(0xffffff), .03, .04, .04));
        e.add(pu); face.add(e); gear.pupils.push(pu); blink.push(e); return e;
      });
      gear.mouth = arc(.15, .028, Math.PI * .8, basic(0x78350f)); gear.mouth.rotation.z = -Math.PI * .9; gear.mouth.position.set(0, -.02, .2); face.add(gear.mouth);
      gear.light = new THREE.PointLight(0xffc34d, 0, 7); gear.light.position.set(0, 0, 1.6); gear.tilt.add(gear.light);
      gear.ring = new THREE.Mesh(new THREE.TorusGeometry(1, .035, 8, 56), basic(0xf59e0b, { transparent: true, opacity: 0, depthWrite: false }));
      gear.ring.position.z = .4; gear.tilt.add(gear.ring);
      const SPK = 28, sp = new Float32Array(SPK * 3);
      gear.sparkV = new Float32Array(SPK * 3);
      const sgeo = new THREE.BufferGeometry(); sgeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
      gear.sparks = new THREE.Points(sgeo, new THREE.PointsMaterial({ color: 0xf59e0b, size: .14, transparent: true, opacity: 0, depthWrite: false }));
      gear.sparks.frustumCulled = false; gear.tilt.add(gear.sparks);
      gear.N1 = N1; gear.N2 = N2; gear.PHI = PHI;
      gear.ang = 0; gear.omega = .7; gear.glow = 0; gear.ringT = 1; gear.sparkT = 1; gear.dizzy = 0; gear.clicks = []; gear.tickAcc = 0; gear.tick = 0;
      gear.g.add(gear.hit = hitProxy(2, -.1, 1.7));
      hits.push(gear);
    }

    [uul, bot, gear].forEach(c => {
      scene.add(c.g);
      Object.assign(c, { x: 0, s: 1, hop: 0, hv: 0, sq: 0, sqv: 0, mood: 0, yaw: 0, pitch: 0 });
    });

    /* ---------- Blob shadows ---------- */
    const shTex = (() => {
      const c = document.createElement('canvas'); c.width = c.height = 64;
      const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(15,23,42,.42)'); g.addColorStop(1, 'rgba(15,23,42,0)');
      x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
    })();
    [uul, bot, gear].forEach(c => {
      c.sh = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.5), new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false }));
      c.sh.rotation.x = -Math.PI / 2; c.sh.position.y = .01; scene.add(c.sh);
    });

    /* ---------- Layout / resize ---------- */
    function layout() {
      const w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      cam.aspect = w / h; cam.updateProjectionMatrix();
      const visW = 2 * Math.tan(15 * Math.PI / 180) * CAM_D * cam.aspect;
      const sp = visW / 3, s = clamp(sp / 3.1, .5, 1.1);
      [bot, uul, gear].forEach((c, i) => { c.x = (i - 1) * sp; c.s = s; c.g.position.x = c.x; });
      draw();
    }
    if (window.ResizeObserver) new ResizeObserver(layout).observe(stage); else addEventListener('resize', layout);

    /* ---------- Input: gaze in 3D + click raycast ---------- */
    const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tgt = new THREE.Vector3(0, 2, 3);
    let lastInput = -1e9, hoverDirty = false, hx = 0, hy = 0;
    function toNdc(cx, cy) { const r = cv.getBoundingClientRect(); ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1); }
    function aim(cx, cy) {
      toNdc(cx, cy); ray.setFromCamera(ndc, cam);
      const t = (3 - ray.ray.origin.z) / ray.ray.direction.z;
      ray.ray.at(clamp(t, 0, 30), tgt); tgt.x = clamp(tgt.x, -9, 9); tgt.y = clamp(tgt.y, -2, 8);
      lastInput = performance.now();
    }
    addEventListener('pointermove', e => { aim(e.clientX, e.clientY); if (e.pointerType === 'mouse') { hoverDirty = true; hx = e.clientX; hy = e.clientY; } }, { passive: true });
    addEventListener('touchmove', e => { const t = e.touches[0]; if (t) aim(t.clientX, t.clientY); }, { passive: true });
    function pick(cx, cy) {
      toNdc(cx, cy); ray.setFromCamera(ndc, cam);
      const hs = ray.intersectObjects(hits.map(c => c.hit), false)[0];
      return hs ? hits.find(c => c.hit === hs.object) : null;
    }
    cv.addEventListener('pointerdown', e => { aim(e.clientX, e.clientY); const c = pick(e.clientX, e.clientY); if (c) onPoke(c.key); }, { passive: true });
    let scrollVel = 0, lastY = scrollY;
    addEventListener('scroll', () => { const y = scrollY; scrollVel += clamp(y - lastY, -80, 80); lastY = y; }, { passive: true });

    /* ---------- Click reactions ---------- */
    const cOf = { uul, bot, gear };
    function bump(c, up, squash) { c.hv = up; c.sq = -squash; c.sqv = 0; c.mood = 1; }
    function clickGear(now) {
      const g = gear;
      g.omega = Math.min(g.omega + 9 + Math.max(0, g.omega) * .15, 34);
      g.glow = 1; g.ringT = 0; g.sparkT = 0;
      g.tick += .035;
      for (let i = 0; i < g.sparkV.length; i += 3) {
        const a = Math.random() * 6.283, v = 1.6 + Math.random() * 2.4;
        g.sparkV[i] = Math.cos(a) * v; g.sparkV[i + 1] = Math.sin(a) * v + .6; g.sparkV[i + 2] = .6 + Math.random() * 1.6;
        const p = g.sparks.geometry.attributes.position.array; p[i] = Math.cos(a) * .9; p[i + 1] = Math.sin(a) * .9; p[i + 2] = .3;
      }
      g.clicks = g.clicks.filter(t => now - t < 1700); g.clicks.push(now);
      if (g.clicks.length >= 5 && g.dizzy <= 0) {
        g.dizzy = 2.4; g.clicks.length = 0; say('gear', 'Pusing… 🌀 ampun!');
        if (navigator.vibrate) { try { navigator.vibrate([12, 40, 12]); } catch (e) {} }
        return true;
      }
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
      return false;
    }
    onPoke = key => {
      const c = cOf[key];
      if (key === 'gear') {
        bump(c, 5.5, .34);
        if (!clickGear(performance.now())) say(key, nextLine(key));
        return;
      }
      say(key, nextLine(key));
      bump(c, key === 'uul' ? 6 : 6.8, .2);
      if (key === 'uul') uul.wave = 1.6; else { bot.ant.v = 14; bot.pulse = 1; }
      if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
    };

    /* ---------- Per-frame update ---------- */
    const _s = x => Math.sin(x);
    function phys(c, dt) {
      c.hv -= 30 * dt; c.hop += c.hv * dt;
      if (c.hop < 0) {
        const imp = -c.hv; c.hop = 0;
        if (imp > 2.5) { c.hv = imp * .22; c.sq = -Math.min(.26, imp * .035); c.sqv = 0; } else c.hv = 0;
      }
      c.sqv += (-170 * c.sq - 9 * c.sqv) * dt; c.sq += c.sqv * dt;
      c.mood *= Math.exp(-dt * 2);
      const sq = clamp(c.sq, -.4, .3);
      c.g.position.y = c.hop * c.s;
      c.g.scale.set(c.s * (1 - sq * .5), c.s * (1 + sq), c.s * (1 - sq * .5));
      c.sh.position.x = c.x;
      c.sh.scale.setScalar(c.s * clamp(1 - c.hop * .1, .5, 1));
      c.sh.material.opacity = clamp(1 - c.hop * .12, .4, 1);
    }
    function gaze(c, headY, dt, idleT) {
      let dx = tgt.x - c.x, dy = tgt.y - headY * c.s;
      if (idleT) { dx = _s(idleT * .7 + c.x) * 4 - c.x * .2; dy = _s(idleT * .9 + c.x) * .8; }
      const yaw = Math.atan2(dx, 4), pitch = Math.atan2(dy, 4), f = 1 - Math.exp(-dt * 9);
      c.yaw += (yaw - c.yaw) * f; c.pitch += (pitch - c.pitch) * f;
    }
    function pupil(p, c, max, ex, ey) {
      p.position.x = clamp(c.yaw * 1.1, -.7, .7) * max + (ex || 0);
      p.position.y = clamp(c.pitch * 1.4, -.5, .5) * max + (ey || 0);
    }
    let bl = 1, blAt = -1, nextBl = 1.5;
    let prev = performance.now(), t = 0;
    function update(dt) {
      t += dt;
      const idleT = performance.now() - lastInput > 3500 ? t : 0;
      const sv = reduce ? 0 : clamp(scrollVel, -80, 80); scrollVel *= Math.exp(-dt * 8);
      [uul, bot, gear].forEach(c => phys(c, dt));
      if (sv) { uul.hv += Math.abs(sv) * .01; gear.omega += sv * .05 * dt * 60 * .08; }

      // blink (shared timing)
      if (blAt < 0 && t > nextBl) blAt = t;
      if (blAt >= 0) { const p = (t - blAt) / .16; if (p >= 1) { bl = 1; blAt = -1; nextBl = t + 1.8 + Math.random() * 3; } else bl = 1 - Math.sin(p * Math.PI) * .92; }
      blink.forEach(e => { e.scale.y = bl; });

      // ---- Uul ----
      gaze(uul, 2.3, dt, idleT);
      uul.head.rotation.y = clamp(uul.yaw * .55, -.5, .5);
      uul.head.rotation.x = clamp(-uul.pitch * .5, -.3, .3) + uul.sq * -.4;
      uul.head.rotation.z = clamp(-uul.yaw * .12, -.15, .15);
      uul.pupils.forEach(p => pupil(p, uul, .035));
      uul.hair.rotation.x = -uul.hv * .01 - uul.mood * .03; uul.hair.position.y = uul.mood * .02 + clamp(uul.hv * .004, -.03, .03);
      uul.torso.scale.y = .82 * (1 + _s(t * 2.2) * .018);
      uul.brows.position.y = uul.mood * .05;
      uul.smile.scale.set(1 + uul.mood * .15, 1 + uul.mood * .6, 1);
      uul.wave = Math.max(0, (uul.wave || 0) - dt);
      const w = uul.wave > 0 ? Math.min(1, uul.wave * 3) : 0;
      uul.arms[0].rotation.z = -.16 + _s(t * 1.8) * .03;
      uul.arms[1].rotation.z = .16 - _s(t * 1.8 + 1) * .03 + w * (2.35 + _s(t * 16) * .35);
      uul.g.rotation.y = clamp(uul.yaw * .18, -.2, .2);

      // ---- Bot ----
      gaze(bot, 2.5, dt, idleT);
      bot.float.position.y = 1.35 + _s(t * 1.9) * .08;
      bot.float.rotation.y = clamp(bot.yaw * .4, -.4, .4);
      bot.float.rotation.x = clamp(-bot.pitch * .12, -.1, .1) + bot.sq * -.2;
      bot.eyes.forEach(e => { e.position.x = (e.position.x < 0 ? -.22 : .22) + clamp(bot.yaw, -.7, .7) * .08; e.position.y = .66 + clamp(bot.pitch, -.5, .5) * .06; });
      bot.ant.v = (bot.ant.v || 0) + (-90 * (bot.ant.a || 0) - 5 * bot.ant.v) * dt; bot.ant.a = (bot.ant.a || 0) + bot.ant.v * dt * .06;
      bot.ant.rotation.z = clamp(bot.ant.a, -.6, .6) + clamp(bot.yaw * .1, -.1, .1);
      const sw = _s(t * 2.4) * .06 + bot.mood * 1.1;
      bot.arms[0].rotation.z = -.2 - sw; bot.arms[1].rotation.z = .2 + sw;
      bot.mouth.scale.set(1 + bot.mood * .25, 1 + bot.mood * .8, 1);
      bot.dots.forEach((d, i) => { d.position.y = -.12 + Math.max(0, _s(t * 5 - i * .9)) * .05; });
      bot.pulse = Math.max(0, (bot.pulse || 0) - dt * 1.2);
      bot.waves.forEach((m, i) => { m.material.opacity = .22 + Math.max(0, _s(t * (3 + bot.pulse * 5) - i * 1.1)) * .78; });
      bot.wifi.rotation.y = _s(t * .9) * .25; bot.wifi.position.y = 2.0 + _s(t * 2.3) * .05 + bot.mood * .1;

      // ---- Gear: inertia, meshing mini gear, glow/ring/sparks, dizzy ----
      const g = gear;
      gaze(g, 1.8, dt, idleT);
      const idleW = reduce ? .2 : .7 + clamp(sv * .02, -2, 2);
      g.omega += (idleW - g.omega) * (1 - Math.exp(-dt * (Math.abs(g.omega) > 6 ? .9 : 1.5)));
      g.ang += g.omega * dt;
      g.big.rotation.z = g.ang;
      g.mini.rotation.z = g.PHI + Math.PI + Math.PI / g.N2 - (g.N1 / g.N2) * (g.ang - g.PHI);
      const step = Math.PI * 2 / g.N1;
      g.tickAcc += g.omega * dt;
      if (Math.abs(g.tickAcc) > step) { g.tickAcc %= step; if (g.omega > 5) g.tick = Math.min(.05, g.tick + .012); }
      g.tick *= Math.exp(-dt * 12);
      g.glow *= Math.exp(-dt * 3);
      const gl = g.glow + clamp((Math.abs(g.omega) - 6) / 40, 0, .3);
      gold_(g, gl);
      g.light.intensity = gl * 5;
      g.ringT = Math.min(1, g.ringT + dt * 1.7);
      const rp = g.ringT;
      g.ring.scale.setScalar(1 + rp * 1.15); g.ring.material.opacity = rp < 1 ? (1 - rp) * .85 : 0;
      g.sparkT = Math.min(1, g.sparkT + dt * 1.6);
      if (g.sparkT < 1) {
        const p = g.sparks.geometry.attributes.position.array;
        for (let i = 0; i < p.length; i += 3) { g.sparkV[i + 1] -= 5 * dt; p[i] += g.sparkV[i] * dt; p[i + 1] += g.sparkV[i + 1] * dt; p[i + 2] += g.sparkV[i + 2] * dt; }
        g.sparks.geometry.attributes.position.needsUpdate = true;
      }
      g.sparks.material.opacity = g.sparkT < 1 ? 1 - g.sparkT : 0;
      const wasDizzy = g.dizzy > 0;
      g.dizzy = Math.max(0, g.dizzy - dt);
      const dz = Math.min(1, g.dizzy * 2);
      g.tilt.rotation.y = clamp(g.yaw * .35, -.35, .35) + _s(t * 9) * .18 * dz;
      g.tilt.rotation.x = clamp(-g.pitch * .25, -.25, .25) + _s(t * 7.3) * .14 * dz + g.tick * 2;
      g.root.rotation.z = _s(t * 6) * .12 * dz + _s(t * 40) * g.tick * .6;
      g.face.rotation.z = _s(t * 1.4) * .04 + _s(t * 11) * .2 * dz;
      g.pupils.forEach(p => { pupil(p, g, .05, Math.cos(t * 14) * .045 * dz, Math.sin(t * 14) * .045 * dz); });
      g.mouth.scale.set(1 - dz * .3 + g.mood * .25, 1 + g.mood * .8 + dz * .9, 1);
      if (wasDizzy && g.dizzy <= 0) say('gear', nextLine('gear'));
    }
    function gold_(g, v) { g.big.material.emissiveIntensity = v * .75; g.face.children[0].material.emissiveIntensity = v * .6; }

    function draw() { renderer.render(scene, cam); }

    /* ---------- Loop: only runs while stage is on screen ---------- */
    let vis = true, running = false;
    function frame(now) {
      if (!vis) { running = false; return; }
      const dt = Math.min(.05, (now - prev) / 1000) || .016; prev = now;
      update(dt);
      if (hoverDirty) { hoverDirty = false; cv.style.cursor = pick(hx, hy) ? 'pointer' : 'default'; }
      draw();
      requestAnimationFrame(frame);
    }
    function start() { if (running) return; running = true; prev = performance.now(); requestAnimationFrame(frame); }
    if (window.IntersectionObserver) new IntersectionObserver(es => { vis = es[0].isIntersecting; if (vis) start(); }).observe(stage);
    layout();
    start();
  })();
  </script>

  </body>
</html>
